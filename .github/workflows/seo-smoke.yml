name: DealLens SEO smoke checks
on:
  pull_request:
    paths:
      - '*.html'
      - 'decision-lab.js'
      - 'ownership-cost.js'
      - 'ownership-core.js'
      - 'tests/**'
      - 'app.js'
      - '*.css'
      - 'sw.js'
      - 'affiliate-config.js'
      - 'scripts/seo_smoke_test.py'
      - '.github/workflows/seo-smoke.yml'
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check decision-lab.js
          node --check ownership-cost.js
          node --check ownership-core.js
          node --check app.js
          node --check affiliate-config.js
          node --check sw.js
      - name: Test calculator math
        run: node tests/ownership-core.test.cjs
      - name: Check page structure and internal links
        run: python scripts/seo_smoke_test.py
