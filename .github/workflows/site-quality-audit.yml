name: Site quality audit

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local links, canonical metadata and sitemap
        run: python site_quality_check.py
      - name: Check all root JavaScript files for syntax errors
        run: |
          set -eu
          for script in ./*.js; do
            echo "Checking $script"
            node --check "$script"
          done
      - name: Check comparison CSV export regression
        run: python test_decision_lab_export.py
